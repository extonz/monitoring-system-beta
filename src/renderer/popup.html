<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian Notification</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: #f5f5f7;
      overflow: hidden;
      user-select: none;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      -webkit-font-smoothing: antialiased;
    }
    .mac-banner {
      width: 100%;
      height: 100%;
      background: rgba(30, 32, 38, 0.95);
      backdrop-filter: blur(40px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.2);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      position: relative;
      animation: bannerSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes bannerSlide {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .banner-close {
      position: absolute;
      top: 7px;
      right: 8px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease;
      z-index: 5;
    }
    .mac-banner:hover .banner-close { opacity: 1; }
    .banner-close:hover { background: rgba(255, 255, 255, 0.25); color: #ffffff; }
    .banner-icon-col { flex-shrink: 0; }
    .mac-squircle-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
    }
    .banner-content-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
    }
    .banner-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.2;
    }
    .banner-app-title { font-weight: 600; letter-spacing: -0.01em; color: rgba(255, 255, 255, 0.7); }
    .banner-dot { font-size: 8px; opacity: 0.5; }
    .banner-time { opacity: 0.8; }
    .banner-title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .banner-desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .banner-proc {
      font-weight: 600;
      color: #f59e0b;
      font-family: ui-monospace, Menlo, Consolas, monospace;
    }
    .banner-actions-col {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
    }
    .mac-pill-btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 11px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: all 0.12s cubic-bezier(0.2, 0, 0, 1);
      text-align: center;
      min-width: 58px;
    }
    .mac-pill-btn.primary { background: #0284c7; color: #ffffff; }
    .mac-pill-btn.primary:hover { background: #0369a1; }
    .mac-pill-btn.primary:active { transform: scale(0.96); }
    .mac-pill-btn.secondary { background: rgba(255, 255, 255, 0.12); color: #f5f5f7; }
    .mac-pill-btn.secondary:hover { background: rgba(255, 255, 255, 0.18); }
    .mac-pill-btn.secondary:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="mac-banner" role="alert" aria-live="assertive">
    <button class="banner-close" id="btn-close" aria-label="Dismiss notification">
      <i data-lucide="x" style="width: 11px; height: 11px; stroke-width: 2.4;"></i>
    </button>
    <div class="banner-icon-col">
      <div class="mac-squircle-icon" aria-hidden="true">
        <i data-lucide="shield" style="width: 18px; height: 18px; stroke-width: 2.2;"></i>
      </div>
    </div>
    <div class="banner-content-col">
      <div class="banner-meta">
        <span class="banner-app-title">Guardian</span>
        <span class="banner-dot">·</span>
        <span class="banner-time">now</span>
      </div>
      <div class="banner-title" id="toast-title">Unauthorized Activity Paused</div>
      <div class="banner-desc" id="toast-msg">
        <span class="banner-proc" id="toast-proc">unknown_payload.exe</span> was paused to protect your files.
      </div>
    </div>
    <div class="banner-actions-col">
      <button class="mac-pill-btn primary" id="btn-recover" aria-label="Restore previous file states">Restore</button>
      <button class="mac-pill-btn secondary" id="btn-details" aria-label="Review details in Guardian">Review</button>
    </div>
  </div>

  <script src="../../assets/lucide.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (window.lucide) window.lucide.createIcons();
      const api = window.guardianAPI;
      const toastProc = document.getElementById('toast-proc');
      const toastMsg = document.getElementById('toast-msg');
      const btnClose = document.getElementById('btn-close');
      const btnDetails = document.getElementById('btn-details');
      const btnRecover = document.getElementById('btn-recover');

      try {
        const state = await api.getState();
        if (state && state.activeIncident) {
          const inc = state.activeIncident;
          if (inc.process && inc.process.name) {
            toastProc.textContent = inc.process.name;
          }
          if (inc.diff && inc.diff.totalChanges) {
            toastMsg.innerHTML = `<span class="banner-proc">${inc.process ? inc.process.name : 'Process'}</span> attempted ${inc.diff.totalChanges} unexpected changes.`;
          }
        }
      } catch (err) {
        console.error('Failed loading incident into toast:', err);
      }

      if (btnClose) btnClose.addEventListener('click', () => window.close());
      if (btnDetails) btnDetails.addEventListener('click', async () => {
        await api.openMainWindow('incidents');
        window.close();
      });
      if (btnRecover) btnRecover.addEventListener('click', async () => {
        btnRecover.textContent = 'Restoring...';
        btnRecover.disabled = true;
        try {
          await api.executeRecovery();
          btnRecover.textContent = 'Restored';
          setTimeout(() => window.close(), 1000);
        } catch {
          btnRecover.textContent = 'Error';
        }
      });
    });
  </script>
</body>
</html>
