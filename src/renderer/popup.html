<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian Notification</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="mac-toast-card" role="alertdialog" aria-labelledby="toast-title" aria-describedby="toast-msg">
    <div class="mac-toast-header">
      <div class="mac-toast-app">
        <div class="mac-toast-icon" aria-hidden="true">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <span class="mac-toast-appname">GUARDIAN</span>
        <span class="mac-toast-dot" aria-hidden="true">•</span>
        <span class="mac-toast-time">now</span>
      </div>
      <button class="mac-toast-close" id="btn-close" title="Dismiss" aria-label="Dismiss notification">
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="mac-toast-body">
      <div class="mac-toast-title" id="toast-title">Unauthorized Activity Contained</div>
      <p class="mac-toast-desc" id="toast-msg">
        <span class="mac-toast-proc" id="toast-proc">unknown_payload.exe</span> was paused after attempting rapid file modifications.
      </p>
    </div>

    <div class="mac-toast-actions">
      <button class="mac-toast-btn secondary" id="btn-details" aria-label="Review incident details">Review</button>
      <button class="mac-toast-btn primary" id="btn-recover" aria-label="Restore affected files">Restore Files</button>
      <button class="mac-toast-btn tertiary" id="btn-allow" aria-label="Allow process to continue">Allow</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
